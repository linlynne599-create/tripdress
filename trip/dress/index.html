<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>欧洲蜜月 OOTD · 把衣服搭到景点照片上</title>
<meta name="description" content="欧洲蜜月行程 OOTD：把衣橱单品拖到景点照片上预览成片，支持裁剪与抠图。" />
<!-- ?v= 是给浏览器看的版本号：改了样式或脚本就把它 +1，免得用户拿到缓存里的旧文件 -->
<link rel="stylesheet" href="styles.css?v=28" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="../">
    <span class="brand-text">欧洲蜜月 OOTD</span>
  </a>
  <p class="brand-sub" id="trip-title">欧洲蜜月行</p>
  <div class="top-actions">
    <button class="btn" id="btn-import" type="button">导入行程</button>
    <button class="btn" id="btn-reset" type="button">重置</button>
    <a class="btn btn-link" href="../">回到行程</a>
  </div>
</header>

<nav class="daystrip" id="daystrip" aria-label="选择日期"></nav>

<main class="workbench">

  <!-- ------------------------------------------------------ 左：成片预览台 -->
  <!-- stage-panel 必须是 workbench 的直接子元素，手机上才能吸顶吸到底 -->
  <section class="stage-panel">
    <div class="stage-head">
      <div>
        <h2 id="stage-title">选一张景点照片</h2>
        <p class="stage-sub" id="stage-sub"></p>
      </div>
      <div class="stage-head-btns">
        <button class="btn btn-sm" id="btn-replace-bg" type="button">换一张</button>
        <button class="btn btn-sm" id="btn-desperson" type="button" title="粗略去掉画面里的人，方便再贴穿搭">去人物</button>
        <button class="btn btn-sm" id="btn-restore-bg" type="button" hidden>恢复原图</button>
        <button class="btn btn-sm btn-go" id="btn-export" type="button">导出</button>
      </div>
    </div>

    <div class="stage-wrap">
      <div class="stage" id="stage" tabindex="0">
        <img class="stage-bg" id="stage-bg" alt="景点照片" />
        <div class="stage-empty" id="stage-empty">
          <p id="stage-empty-t">这一天还没有照片</p>
          <button class="btn" id="btn-empty-add" type="button">导入一张景点照片</button>
        </div>
      </div>
      <p class="stage-hint" id="stage-hint">把右边衣橱里的单品拖进来 · 也可以直接把电脑里的图片拖到这张照片上</p>
    </div>

    <div class="layerbar" id="layerbar" hidden></div>
  </section>

  <section class="rail-panel">
    <div class="rail">
      <div class="rail-head">
        <h3>景点</h3>
        <button class="btn btn-sm" id="btn-add-spot" type="button">加地点</button>
      </div>
      <div class="rail-track" id="spot-rail"></div>
    </div>

  </section>

  <!-- ---------------------------------------------------------- 右：衣橱 -->
  <aside class="wardrobe">
    <div class="wd-head">
      <h3>我的衣橱</h3>
      <button class="btn btn-sm" id="btn-add-piece" type="button">加单品</button>
    </div>
    <p class="wd-note">支持拖拽导入照片，可以上传多种穿搭类别，可以将衣橱照片拖入上方景点照内进行预览。裁剪：⛶　抠图：✂</p>
    <div class="wd-cats" id="wd-cats"></div>

    <div class="wd-head wd-head-2">
      <h3>今日穿搭</h3>
    </div>
    <div class="daylook" id="day-summary"></div>
  </aside>

</main>

<!-- 通用弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modal-card"></div>
</div>

<!-- 拖拽时跟随手指的影子 -->
<img class="dragghost" id="dragghost" alt="" hidden />

<div class="toast" id="toast" hidden></div>

<input type="file" id="filepick" accept="image/*" multiple hidden />

<script src="../data/trip-data.js"></script>
<script src="app.js?v=28"></script>
</body>
</html>
